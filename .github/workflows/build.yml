name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew build --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Report failure
        if: steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          grep -E "error:|^e: |FAILURE:|What went wrong|Caused by" build.log | head -8 | while IFS= read -r line; do
            echo "::error::$line"
          done

          {
            echo "### Build failed"
            echo ""
            echo '```'
            grep -nE "error:|^e: |FAILURE:|What went wrong|Caused by|Could not resolve" build.log | head -60
            echo ""
            echo "----- tail -----"
            tail -c 8000 build.log
            echo '```'
          } > report.md

          if [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --body-file report.md || true
          fi
          tail -c 8000 build.log
          exit 1

      - name: Upload jar
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: aimobs-jar
          path: build/libs/*.jar
          if-no-files-found: error
